name: Check

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/check.yml"
      - "flake.nix"
      - "flake.lock"
      - "module.nix"
      - "modules/**"
  pull_request:
    paths:
      - ".github/workflows/check.yml"
      - "flake.nix"
      - "flake.lock"
      - "module.nix"
      - "modules/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check
        run: |
          nix flake check --no-build --all-systems --no-update-lock-file
          nix build --no-link --no-update-lock-file .#checks.x86_64-linux.module
